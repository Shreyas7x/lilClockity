plugins { id 'com.android.application' }
android {
    namespace "com.clockity.lilclockity"
    compileSdk 35
    defaultConfig {
        applicationId "com.clockity.lilclockity"
        minSdk 24
        targetSdk 34
        versionCode 52
        versionName "5.2"
    }
    signingConfigs {
        release {
            storeFile file("fdroid-release.keystore")
            storePassword "fdroid"
            keyAlias "fdroid"
            keyPassword "fdroid"
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
        debug {
            signingConfig signingConfigs.release
        }
    }
}

